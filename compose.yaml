services:
  redis:
    image: redis:7.4-alpine
    container_name: ticketing-redis
    restart: unless-stopped

    # Expone Redis solamente en esta computadora durante el desarrollo.
    ports:
      - "127.0.0.1:6379:6379"

    # AOF conserva los datos del broker entre reinicios del contenedor.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
