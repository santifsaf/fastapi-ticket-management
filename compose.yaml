services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket-management-postgres
    restart: unless-stopped

    # Estos valores son predeterminados locales y pueden reemplazarse mediante
    # variables POSTGRES_* sin modificar el archivo Compose.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_management}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing_dev_password}

    # Se usa 5433 en Windows para convivir con un PostgreSQL local en 5432.
    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: ticket-management-redis
    restart: unless-stopped

    # Expone Redis solamente en esta computadora durante el desarrollo.
    ports:
      - "127.0.0.1:6379:6379"

    # AOF conserva los datos del broker entre reinicios del contenedor.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ticket-management:dev
    build:
      context: .
    container_name: ticket-management-api
    restart: unless-stopped

    # Dentro de Compose los servicios se alcanzan por nombre, no por localhost.
    environment:
      APP_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ticket_user}:${POSTGRES_PASSWORD:-ticketing_dev_password}@postgres:5432/${POSTGRES_DB:-ticket_management}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-docker-development-secret}
      APP_REDIS_URL: redis://redis:6379/0
      APP_CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    image: ticket-management:dev
    build:
      context: .
    container_name: ticket-management-worker
    restart: unless-stopped

    # El worker comparte infraestructura con la API, pero ejecuta otro proceso.
    environment:
      APP_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ticket_user}:${POSTGRES_PASSWORD:-ticketing_dev_password}@postgres:5432/${POSTGRES_DB:-ticket_management}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-docker-development-secret}
      APP_REDIS_URL: redis://redis:6379/0
      APP_CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # -A selecciona nuestra app Celery; worker inicia el consumidor de tareas.
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --hostname=worker@%h
      # Una sola tarea simultánea alcanza para este worker especializado.
      - --concurrency=1

  beat:
    image: ticket-management:dev
    build:
      context: .
    container_name: ticket-management-beat
    restart: unless-stopped

    # Beat solo publica mensajes en Redis. La URL de base es necesaria porque
    # forma parte de la configuración central, aunque Beat no consulta tickets.
    environment:
      APP_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ticket_user}:${POSTGRES_PASSWORD:-ticketing_dev_password}@postgres:5432/${POSTGRES_DB:-ticket_management}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-docker-development-secret}
      APP_REDIS_URL: redis://redis:6379/0
      APP_CELERY_BROKER_URL: redis://redis:6379/0
      APP_AUTO_ASSIGNMENT_POLL_SECONDS: ${APP_AUTO_ASSIGNMENT_POLL_SECONDS:-60}

    depends_on:
      redis:
        condition: service_healthy

    # El archivo local mantiene el estado del calendario y /tmp es escribible
    # por el usuario sin privilegios definido en el Dockerfile.
    command:
      - python
      - -m
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule

  migrate:
    image: ticket-management:dev
    build:
      context: .
    container_name: ticket-management-migrate

    # Esta URL usa el DNS interno de Compose, no el puerto publicado en Windows.
    environment:
      APP_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ticket_user}:${POSTGRES_PASSWORD:-ticketing_dev_password}@postgres:5432/${POSTGRES_DB:-ticket_management}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-docker-development-secret}

    depends_on:
      postgres:
        condition: service_healthy

    # Es un proceso puntual: aplica migraciones y termina.
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    profiles: ["tools"]

volumes:
  postgres-data:
  redis-data:
